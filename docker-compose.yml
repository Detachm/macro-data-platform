services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: macro_data
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: macro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro -d macro_data"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - macro_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://macro:macro@postgres:5432/macro_data
    command: ["uvicorn", "macro_platform.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://macro:macro@postgres:5432/macro_data
    command: ["python", "-m", "macro_platform.jobs.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  macro_postgres_data:

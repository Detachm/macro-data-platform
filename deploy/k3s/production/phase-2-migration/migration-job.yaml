apiVersion: batch/v1
kind: Job
metadata:
  name: macro-data-migration
  namespace: macro-data-platform
  labels:
    app.kubernetes.io/name: macro-data-platform
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: macro-data-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: macro-data-platform
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: macro-data-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: macro-data-platform:0.1.0
          imagePullPolicy: Never
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: macro-postgres
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

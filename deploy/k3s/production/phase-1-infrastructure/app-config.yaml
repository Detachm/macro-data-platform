apiVersion: v1
kind: ConfigMap
metadata:
  name: macro-runtime-config
  namespace: macro-data-platform
  labels:
    app.kubernetes.io/name: macro-data-platform
data:
  APP_ENV: production
  PROVIDER_MODE: live
  US_PROVIDER_MODE: live
  LOG_LEVEL: INFO
  API_HOST: 0.0.0.0
  API_PORT: "8000"
  PROVIDER_TIMEOUT_SECONDS: "30"
  HK_XTQUANT_PORT: "58615"
  WORKER_SCHEDULE_TIMEZONE: Asia/Shanghai
  WORKER_SCHEDULE_HOUR_LOCAL: "7"
  WORKER_SCHEDULE_MINUTE_LOCAL: "50"
  WORKER_SCHEDULE_POLL_SECONDS: "60"
  WORKER_REPORT_CUTOFF_HOUR_LOCAL: "8"
  WORKER_REPORT_CUTOFF_MINUTE_LOCAL: "15"
  WORKER_REPORT_PUBLISH_HOUR_LOCAL: "8"
  WORKER_REPORT_PUBLISH_MINUTE_LOCAL: "30"
  WORKER_BAR_LOOKBACK_DAYS: "14"
  WORKER_MAX_TASK_ATTEMPTS: "3"
  WORKER_MAX_REPORT_ATTEMPTS: "3"
  WORKER_RETRY_DELAY_SECONDS: "1"
  WORKER_MARKET_FRESHNESS_HOURS: "36"
  WORKER_NEWS_FRESHNESS_HOURS: "24"
  REPORT_WORKFLOW_VERSION: v1
  REPORT_GENERATION_MODEL: deterministic-fallback
  REPORT_GENERATION_TIMEOUT_SECONDS: "30"
  REPORT_GENERATION_MAX_ATTEMPTS: "1"
  FEISHU_DELIVERY_ENABLED: "true"
  FEISHU_API_BASE_URL: https://open.feishu.cn
  FEISHU_TIMEOUT_SECONDS: "15"
  FEISHU_DELIVERY_MAX_ATTEMPTS: "3"
  FEISHU_DELIVERY_MAX_TOTAL_ATTEMPTS: "10"

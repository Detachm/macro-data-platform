apiVersion: v1
kind: Pod
metadata:
  name: postgres-restore-drill
  namespace: macro-data-platform
  labels:
    app.kubernetes.io/name: postgres-restore-drill
    app.kubernetes.io/component: restore-drill
    app.kubernetes.io/part-of: macro-data-platform
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  securityContext:
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: postgres
      image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
      imagePullPolicy: IfNotPresent
      env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: macro-postgres
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: macro-postgres
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: macro-postgres
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      readinessProbe:
        exec:
          command:
            - sh
            - -ec
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: restore-data
          mountPath: /var/lib/postgresql/data
        - name: archive-backups
          mountPath: /archive/backups
          readOnly: true
  volumes:
    - name: restore-data
      emptyDir:
        sizeLimit: 20Gi
    - name: archive-backups
      persistentVolumeClaim:
        claimName: postgres-backup-archive

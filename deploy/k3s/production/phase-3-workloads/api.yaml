apiVersion: v1
kind: Service
metadata:
  name: macro-data-api
  namespace: macro-data-platform
  labels:
    app.kubernetes.io/name: macro-data-platform
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: macro-data-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: macro-data-platform
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: macro-data-api
  namespace: macro-data-platform
  labels:
    app.kubernetes.io/name: macro-data-platform
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: macro-data-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: macro-data-platform
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: macro-data-platform
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: macro-data-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: macro-data-platform:0.1.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: macro-runtime-config
            - secretRef:
                name: macro-runtime
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: macro-postgres
                  key: DATABASE_URL
            - name: HK_XTQUANT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

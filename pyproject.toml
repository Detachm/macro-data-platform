[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "macro-data-platform"
version = "0.1.0"
description = "Backend data foundation for APAC and US macro analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "baostock>=0.9.3,<0.10",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.27,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
  "testcontainers[postgres]>=4.9,<5",
]

[project.scripts]
macro-data-worker = "macro_platform.jobs.scheduler:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures/**/*.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["macro_platform"]

[[tool.mypy.overrides]]
module = ["alembic.*", "baostock", "baostock.*", "testcontainers.*", "xtquant", "xtquant.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: calls a real external provider and is excluded from normal CI",
  "integration: requires PostgreSQL or another process-level dependency",
  "e2e: exercises worker, database, and API together",
]

[tool.coverage.run]
branch = true
source = ["macro_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

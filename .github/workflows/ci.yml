name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: macro_data_test
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macro -d macro_data_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      SERVICE_TOKEN: ci-only-token
      DATABASE_URL: postgresql+asyncpg://macro:macro@127.0.0.1:5432/macro_data_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and project
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --dev
      - name: Format and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run mypy --strict src
      - name: Migration checks
        run: |
          test "$(uv run alembic heads | wc -l | tr -d ' ')" = "1"
          uv run alembic upgrade head
          test "$(uv run alembic current | grep -c '(head)')" = "1"
      - name: Offline tests
        run: uv run pytest -m "not live" --cov=macro_platform --cov-report=term-missing
      - name: Dependency audit
        run: uv run pip-audit

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --tag macro-data-platform:ci .
      - name: Verify production entrypoints
        run: |
          docker run --rm --entrypoint sh macro-data-platform:ci -ec '
            test -f /app/alembic.ini
            test -d /app/migrations/versions
            command -v alembic
            command -v macro-data-worker
            command -v macro-data-archive-monitor
            macro-data-worker --help >/dev/null
            macro-data-archive-monitor --help >/dev/null
          '
